<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Name</title>
<!-- Optional web font: Google Fonts only, and keep the fallback stack in --font-*.
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=FAMILY:wght@400;600&display=swap">
-->
<script>
  // ?theme=dark or ?theme=light forces a theme, for checking both.
  try {
    var forced = new URLSearchParams(location.search).get('theme');
    if (forced === 'dark' || forced === 'light') document.documentElement.dataset.theme = forced;
  } catch (e) {}
</script>
<style>
  /* Light palette. Replace the values with the page's own palette; keep the names
     in sync with both dark blocks below. */
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1b1e24;
    --muted: #5a6170;
    --border: #d9dde4;
    --accent: #2557b3;
    --accent-text: #ffffff;

    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-display: var(--font-body);
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    /* Type scale, ratio 1.25. Use only these sizes. */
    --step--1: 0.875rem;
    --step-0: 1rem;
    --step-1: 1.25rem;
    --step-2: 1.5625rem;
    --step-3: 1.953rem;
    --step-4: 2.441rem;

    --gutter: 16px;
    --radius: 6px;
    --measure: 68ch;
  }

  /* Dark palette, used when the OS is dark unless the page is forced light... */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14171c;
      --surface: #1c2027;
      --text: #e6e8ec;
      --muted: #9aa2b1;
      --border: #2e343e;
      --accent: #7aa7f0;
      --accent-text: #0e1420;
    }
  }
  /* ...and always when the page is forced dark. Same values as above. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171c;
    --surface: #1c2027;
    --text: #e6e8ec;
    --muted: #9aa2b1;
    --border: #2e343e;
    --accent: #7aa7f0;
    --accent-text: #0e1420;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--step-0)/1.55 var(--font-body);
  }
  main { max-width: 960px; margin: 0 auto; padding: 40px var(--gutter) 64px; }

  h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 1.8em 0 0.5em; }
  h1 { font-size: var(--step-4); margin-top: 0; }
  h2 { font-size: var(--step-2); }
  h3 { font-size: var(--step-1); }
  p, li { max-width: var(--measure); }
  .lede { font-size: var(--step-1); color: var(--muted); margin-top: 0; }
  a { color: var(--accent); }
  img, svg, video { max-width: 100%; height: auto; }

  /* Only wide tables and code scroll, inside their own container. */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  code, pre { font-family: var(--font-mono); font-size: var(--step--1); }
  pre { margin: 0; padding: 12px 14px; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: var(--radius); padding: 8px 14px; cursor: pointer;
  }
  input, select, textarea {
    background: var(--surface); border: 1px solid var(--muted);
    border-radius: var(--radius); padding: 6px 10px;
  }
  label { display: block; font-weight: 600; margin-bottom: 4px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Page name</h1>
  <p class="lede">One or two sentences: what this page tells the reader, conclusion first.</p>

  <h2>First section</h2>
  <p>Replace this with real content.</p>
</main>
</body>
</html>
